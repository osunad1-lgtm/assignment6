<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Blue Blood Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Sixtyfour&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    } body {
        background: whitesmoke;
    } #page {
        width: 1000px;
        height: auto;
        background: #000000;
        border: 1px solid dimgray;
        margin: 0 auto;
    } main {
        width: 768px;
        height: 768px;
        margin: 36px auto;
        display: grid;
        grid-gap: 5px;
        grid-template: repeat(3,256px) / repeat(2,384px);
    } header img {
        width: 100%;
         margin-bottom: 24px;
    } header h1 {
        font: 48pt/1.4em 'Sixtyfour';
        text-align: center;
        margin-top: 24px;
		color: #0074FF
	}header h2 {
		font: 18pt/1.4em 'Basic';
		color: white; 
		text-align: center;
	
    } main img {
        width: 78%
    } main img:nth-child(1) {
        grid-area: 1/1/2/2;
    } main img:nth-child(2) {
        grid-area: 2/1/3/2;
    } main img:nth-child(3) {
        grid-area: 3/1/4/2;
    } main img:nth-child(4) {
        grid-area: 1/2/2/4;
}
</style>
</head>

<body>
    <div id="page">
        <header>
            <img src="gridbanner.png" />
           <h1>BLUE BLOOD</h1>

            <img src="choerry.png" class="choerry" />

        </main>
        <footer>

    </div>
</body>
</html>
